name: forecast

# GitHub throttles cron on young repos (observed: 2 runs in 8 hours instead of 16), so the
# workflow re-arms itself after each deploy. Cron at off-peak minutes stays as the fallback
# that restarts the chain if it ever breaks.
on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "22,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: JS unit tests
        run: if [ -d tests/js ]; then node --test "tests/js/*.test.mjs"; fi
      - name: Build forecast
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m forecast.build --out site/data/forecast.json --snapshots-url https://youngerfornday.github.io/tykho-chy-ni/data/snapshots.json
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5.0.1

  rearm:
    needs: deploy
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    steps:
      - name: Wait, then start the next refresh unless another run is already active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SELF_ID: ${{ github.run_id }}
        run: |
          sleep 1500
          active=$(gh run list --workflow forecast.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${SELF_ID} and (.status | IN(\"queued\", \"in_progress\", \"waiting\", \"pending\", \"requested\")))] | length")
          if [ "$active" -eq 0 ]; then
            gh workflow run forecast.yml --ref main
            echo "next refresh dispatched"
          else
            echo "another run is active ($active); it keeps the chain going"
          fi
