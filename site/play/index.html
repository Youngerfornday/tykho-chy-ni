<body class="play">
<!--
THESIS: A phone-first betting shell in the alert map's own dark language: the night sky stays overhead, the line reads like the map's table, chips and odds are mono, and every reward stays in the sky (shooting star, the rooftop cat), never fireworks.
OWN-WORLD: #141921 ground, #2A2D31 panels with 1px #3f4246 rules, square legend chips, bin colors only for chance meters, yellow for odds and the primary action, green for wins only.
STORY: Check the line is open, pick markets from the missions or the filters, build the coupon, place, sleep; come back to settled bets, a night summary to share, and a level that grows with skill.
FIRST VIEWPORT (390): top bar with balance and level, the sky strip with the countdown, the missions of the night, the four featured markets.
FORM: brief-pinned world, no roll; signature interaction: odds tiles turning yellow as they enter the coupon, coupon count in the tab bar.
-->
  <a class="skip" href="#screen-line-title">До лінії</a>
  <div class="app" id="app" data-route="line">
    <header class="top">
      <a class="top__back" href="../"><span id="back-icon"></span><span>Прогноз</span></a>
      <h1 class="wordmark"><span class="wordmark__moon" id="wordmark-icon"></span><span class="wordmark__text">Гра</span></h1>
      <button type="button" class="balance" id="balance" aria-label="Баланс фішок. Відкрити мої ставки"></button>
      <button type="button" class="level" id="level" aria-label="Рівень. Відкрити прогрес"></button>
    </header>

    <div class="sky" id="sky" data-open="false">
      <div class="sky__art" id="sky-art"></div>
      <p class="sky__status" role="status">
        <span class="sky__label" id="line-label">Завантаження лінії…</span>
        <span class="sky__clock" id="line-clock" hidden></span>
      </p>
      <span class="sky__mark" aria-hidden="true">ПРОГНОЗ · не офіційна тривога</span>
    </div>

    <div class="body">
      <aside class="rail" id="rail" aria-label="Рівень і завдання"></aside>
      <main class="main" id="main">
        <div class="center">
          <section class="screen screen--line" id="screen-line" aria-labelledby="screen-line-title"></section>
          <section class="screen screen--progress" id="screen-progress" aria-labelledby="screen-progress-title" hidden></section>
        </div>
        <div class="side">
          <div class="sidetabs" id="sidetabs" role="tablist" aria-label="Купон і ставки"></div>
          <section class="screen screen--coupon" id="screen-coupon" aria-labelledby="screen-coupon-title" hidden></section>
          <section class="screen screen--bets" id="screen-bets" aria-labelledby="screen-bets-title" hidden></section>
        </div>
      </main>
    </div>

    <nav class="tabbar" aria-label="Розділи гри">
      <div class="tabbar__list" id="tabbar-list" role="tablist" aria-label="Розділи"></div>
    </nav>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
